<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Android 配色方案对比</title>
<style>
body { background: #111; color: #fff; font-family: -apple-system, sans-serif; padding: 20px; display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
.phone { width: 320px; background: #1a1a2e; border-radius: 24px; padding: 40px 20px; border: 2px solid #333; }
.phone h3 { text-align: center; color: #a0a0b0; margin-bottom: 20px; font-size: 14px; }
.phone h2 { text-align: center; margin-bottom: 30px; font-size: 18px; }
.input-box { border-radius: 8px; padding: 14px; margin-bottom: 12px; position: relative; }
.input-box .label { position: absolute; top: -8px; left: 12px; font-size: 11px; padding: 0 4px; }
.input-box .hint { font-size: 14px; }
.btn { width: 100%; padding: 16px; border-radius: 12px; background: #4a6fa5; color: #fff; text-align: center; font-size: 16px; margin-top: 16px; }
</style>
</head>
<body>

<div class="phone">
<h3>方案 A：浅色文字 + 深边框</h3>
<h2 style="color:#a0a0b0">Quick Todo</h2>
<div class="input-box" style="background:#16213e; border: 1.5px solid #555555;">
<div class="label" style="color:#cccccc; background:#16213e;">项目名称</div>
<div class="hint" style="color:#cccccc;">选填，不填进收件箱</div>
</div>
<div class="input-box" style="background:#16213e; border: 1.5px solid #555555; min-height: 80px;">
<div class="label" style="color:#cccccc; background:#16213e;">内容</div>
<div class="hint" style="color:#cccccc;">明天下午3点 开会 重要 1小时</div>
</div>
<div class="btn">发送</div>
</div>

<div class="phone">
<h3>方案 B：暖色调</h3>
<h2 style="color:#a0a0b0">Quick Todo</h2>
<div class="input-box" style="background:#1e2a45; border: 1.5px solid #5a7a9a;">
<div class="label" style="color:#b0a090; background:#1e2a45;">项目名称</div>
<div class="hint" style="color:#b0a090;">选填，不填进收件箱</div>
</div>
<div class="input-box" style="background:#1e2a45; border: 1.5px solid #5a7a9a; min-height: 80px;">
<div class="label" style="color:#b0a090; background:#1e2a45;">内容</div>
<div class="hint" style="color:#b0a090;">明天下午3点 开会 重要 1小时</div>
</div>
<div class="btn">发送</div>
</div>

<div class="phone">
<h3>方案 C：高对比</h3>
<h2 style="color:#a0a0b0">Quick Todo</h2>
<div class="input-box" style="background:#253550; border: 1.5px solid #6688aa;">
<div class="label" style="color:#e0e0e0; background:#253550;">项目名称</div>
<div class="hint" style="color:#e0e0e0;">选填，不填进收件箱</div>
</div>
<div class="input-box" style="background:#253550; border: 1.5px solid #6688aa; min-height: 80px;">
<div class="label" style="color:#e0e0e0; background:#253550;">内容</div>
<div class="hint" style="color:#e0e0e0;">明天下午3点 开会 重要 1小时</div>
</div>
<div class="btn">发送</div>
</div>

</body>
</html>
