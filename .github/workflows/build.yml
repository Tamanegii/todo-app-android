name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias quicktodo -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass quicktodo123 -keypass quicktodo123 \
            -dname "CN=QuickTodo, O=Tamanegi, L=CN"
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner sign \
            --ks release.keystore \
            --ks-key-alias quicktodo \
            --ks-pass pass:quicktodo123 \
            --key-pass pass:quicktodo123 \
            --out app/build/outputs/apk/release/QuickTodo.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Get version
        id: version
        run: echo "tag=v1.0.$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Quick Todo ${{ steps.version.outputs.tag }}
          files: app/build/outputs/apk/release/QuickTodo.apk
